name: JANUS P0 Preservation Federation Current Main v1

on:
  pull_request:
    paths:
      - '.github/workflows/janus-p0-preservation-federation-current-main-v1.yml'

permissions:
  contents: read

jobs:
  current-main-compatible-view:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact synthetic merge without write credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Freeze current Genesis base and workflow-only committed delta
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE='227d42d6848790031916cac53d39961a19c35d08'
          WORKFLOW='.github/workflows/janus-p0-preservation-federation-current-main-v1.yml'
          test '${{ github.event.pull_request.base.sha }}' = "$EXPECTED_BASE"
          test "$(git rev-parse "$GITHUB_SHA^1")" = "$EXPECTED_BASE"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_BASE" "$GITHUB_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$WORKFLOW"
          echo "GENESIS_CURRENT_MAIN_BASE=$EXPECTED_BASE"
          echo "SYNTHETIC_MERGE_SHA=$GITHUB_SHA"
          echo 'COMMITTED_RUNTIME_DELTA=0'

      - name: Verify exact preservation producer PR heads are still the frozen heads
        shell: bash
        run: |
          set -euo pipefail
          check_pr_head() {
            local pr="$1" expected="$2"
            git fetch --no-tags https://github.com/Hawkar-usls/Janus_Genesis.git \
              "+refs/pull/${pr}/head:refs/remotes/p0/pr${pr}"
            local observed
            observed="$(git rev-parse "refs/remotes/p0/pr${pr}")"
            test "$observed" = "$expected"
            echo "PR_${pr}_HEAD=$observed"
          }

          check_pr_head 122 dc8e96ba1c0417afa5ce9785b10e60e68a043629
          check_pr_head 125 046a59b868a5dcb1006cd4734a8dd6b5d2938ad5
          check_pr_head 126 179de8dbc5c7ec960e78dc90a2b67456ca67111b
          check_pr_head 123 57c05559eeda761821c48e3050f2d2645f9ce049
          check_pr_head 124 94b0f1b776ad9bdcbc55d9fe660a1de9aa177e3c
          check_pr_head 127 2d86ce229a1ac939f521ef6f2dfd95a4f3d75fe7
          check_pr_head 133 5c86eeb6d99bebab4e7aba92c0d1a4a1893499de
          check_pr_head 137 5627d31a992bcdc71dcc7351cba2c515dac89a2c
          check_pr_head 138 28bf0b4e9ab9ba3268f22bdbd82a0ecfd3396768

          SWARM_REPO='https://github.com/Hawkar-usls/janus-distributed-ai-swarm.git'
          SWARM_P5_EXPECTED='649cc94016cd9d0aba4a8aabf1eb74577c691c49'
          SWARM_MAIN_EXPECTED='b0bb07418cb1c0e1bc2da8ae443977825c0b19d1'
          SWARM_P9_EXPECTED='1d5a1c46ed5e6f99c4bb4cc745bf3c741809c120'
          test "$(git ls-remote "$SWARM_REPO" refs/pull/5/head | cut -f1)" = "$SWARM_P5_EXPECTED"
          test "$(git ls-remote "$SWARM_REPO" refs/heads/main | cut -f1)" = "$SWARM_MAIN_EXPECTED"
          test "$(git ls-remote "$SWARM_REPO" refs/pull/9/head | cut -f1)" = "$SWARM_P9_EXPECTED"
          echo "SWARM_RECOVERY_PR5_HEAD=$SWARM_P5_EXPECTED"
          echo "SWARM_CURRENT_MAIN=$SWARM_MAIN_EXPECTED"
          echo "SWARM_CURRENT_MAIN_FENCING_REPLAY_PR9_HEAD=$SWARM_P9_EXPECTED"

      - name: Build ephemeral exact-producer compatibility overlay
        shell: bash
        run: |
          set -euo pipefail
          BASELINE='93c6d9be6129f140fc0341bbee24df1160827c62'
          CURRENT_BASE='227d42d6848790031916cac53d39961a19c35d08'

          overlay_from_baseline() {
            local sha="$1"
            mapfile -t paths < <(git diff --name-only --diff-filter=AM "$BASELINE" "$sha" -- . ':(exclude).github/workflows/**')
            test "${#paths[@]}" -gt 0
            for path in "${paths[@]}"; do
              if git cat-file -e "$CURRENT_BASE:$path" 2>/dev/null; then
                current_blob="$(git rev-parse "$CURRENT_BASE:$path")"
                producer_blob="$(git rev-parse "$sha:$path")"
                test "$current_blob" = "$producer_blob" || {
                  echo "PRODUCER_PATH_COLLIDES_WITH_CURRENT_MAIN=$path" >&2
                  exit 1
                }
              fi
            done
            git checkout "$sha" -- "${paths[@]}"
            printf 'OVERLAY_%s_FILES=%s\n' "${sha:0:8}" "${#paths[@]}"
          }

          overlay_exact_paths() {
            local sha="$1"; shift
            for path in "$@"; do
              git cat-file -e "$sha:$path"
              if git cat-file -e "$CURRENT_BASE:$path" 2>/dev/null; then
                current_blob="$(git rev-parse "$CURRENT_BASE:$path")"
                producer_blob="$(git rev-parse "$sha:$path")"
                test "$current_blob" = "$producer_blob" || {
                  echo "PRODUCER_PATH_COLLIDES_WITH_CURRENT_MAIN=$path" >&2
                  exit 1
                }
              fi
            done
            git checkout "$sha" -- "$@"
          }

          overlay_from_baseline dc8e96ba1c0417afa5ce9785b10e60e68a043629
          overlay_exact_paths 046a59b868a5dcb1006cd4734a8dd6b5d2938ad5 \
            tools/janus_nexus_preservation_replay.py \
            tests/test_janus_nexus_preservation_replay_v1.py \
            protocol/JANUS_NEXUS_PRESERVATION_REPLAY-v1.0.json
          overlay_from_baseline 179de8dbc5c7ec960e78dc90a2b67456ca67111b
          overlay_from_baseline 57c05559eeda761821c48e3050f2d2645f9ce049
          overlay_from_baseline 94b0f1b776ad9bdcbc55d9fe660a1de9aa177e3c
          overlay_from_baseline 2d86ce229a1ac939f521ef6f2dfd95a4f3d75fe7
          overlay_from_baseline 5c86eeb6d99bebab4e7aba92c0d1a4a1893499de
          overlay_from_baseline 5627d31a992bcdc71dcc7351cba2c515dac89a2c
          overlay_exact_paths 28bf0b4e9ab9ba3268f22bdbd82a0ecfd3396768 \
            protocol/JANUS_P0_PRESERVATION_PRODUCER_LOCK-2026-08-16-v1.0.json

          echo 'EPHEMERAL_OVERLAY_ONLY=TRUE'
          echo 'SOURCE_HISTORY_REWRITE=FALSE'
          echo 'REMOTE_SOURCE_WRITEBACK=FALSE'

      - name: Validate frozen producer lock digest and exact public refs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          path = Path('protocol/JANUS_P0_PRESERVATION_PRODUCER_LOCK-2026-08-16-v1.0.json')
          lock = json.loads(path.read_text(encoding='utf-8'))
          payload = json.dumps(lock, sort_keys=True, separators=(',', ':'), ensure_ascii=False, allow_nan=False).encode('utf-8')
          digest = hashlib.sha256(payload).hexdigest()
          expected = '3a1c2763ebe7d614a539b464eb3f75d0d74d362e0f061f8e732fc3554bc3c1d4'
          assert digest == expected, (digest, expected)

          expected_refs = {
              'materializer': ('Hawkar-usls/Janus_Genesis', 122, 'dc8e96ba1c0417afa5ce9785b10e60e68a043629'),
              'privacy_projection': ('Hawkar-usls/Janus_Genesis', 125, '046a59b868a5dcb1006cd4734a8dd6b5d2938ad5'),
              'source_pin_contract': ('Hawkar-usls/Janus_Genesis', 126, '179de8dbc5c7ec960e78dc90a2b67456ca67111b'),
              'variant_lineage': ('Hawkar-usls/Janus_Genesis', 123, '57c05559eeda761821c48e3050f2d2645f9ce049'),
              'handoff_ledger': ('Hawkar-usls/Janus_Genesis', 124, '94b0f1b776ad9bdcbc55d9fe660a1de9aa177e3c'),
              'swarm_recovery': ('Hawkar-usls/janus-distributed-ai-swarm', 5, '649cc94016cd9d0aba4a8aabf1eb74577c691c49'),
              'source_identity_guard': ('Hawkar-usls/Janus_Genesis', 133, '5c86eeb6d99bebab4e7aba92c0d1a4a1893499de'),
          }
          refs = lock.get('producer_refs') or lock.get('producers')
          assert isinstance(refs, dict), lock.keys()
          for role, (repo, pr, sha) in expected_refs.items():
              row = refs[role]
              assert row['repository'] == repo, (role, row)
              assert int(row['pull_request']) == pr, (role, row)
              assert row['sha'] == sha, (role, row)
          print(f'PRODUCER_LOCK_SHA256={digest}')
          print('PRODUCER_LOCK_EXACT_REFS=PASS')
          PY

      - name: Compile and replay all public preservation primitives together
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess, sys
          from pathlib import Path

          tools = [
              'tools/janus_nexus_materializer.py',
              'tools/janus_nexus_preservation_replay.py',
              'tools/janus_source_pin_contract.py',
              'tools/janus_nexus_variant_lineage.py',
              'tools/janus_face_handoff_ledger.py',
              'tools/janus_preservation_integration_evidence.py',
              'tools/janus_source_identity_guard.py',
          ]
          for item in tools:
              assert Path(item).is_file(), item
          subprocess.run([sys.executable, '-m', 'py_compile', *tools], check=True)

          patterns = [
              'test_janus_nexus_materializer*.py',
              'test_janus_nexus_preservation_replay_v1.py',
              'test_janus_source_pin_contract_v1.py',
              'test_janus_nexus_variant_lineage_v1.py',
              'test_janus_face_handoff_ledger_v1.py',
              'test_janus_preservation_integration_*.py',
              'test_janus_source_identity_guard_v1.py',
              'test_constellation_role_audit_v1.py',
          ]
          for pattern in patterns:
              matches = list(Path('tests').glob(pattern))
              assert matches, f'no tests matched {pattern}'
              subprocess.run(
                  [sys.executable, '-m', 'unittest', 'discover', '-s', 'tests', '-p', pattern, '-v'],
                  check=True,
              )
          print('PUBLIC_PRESERVATION_PRIMITIVES_CURRENT_MAIN_COMPATIBILITY=PASS')
          print('LINEAGE_FAILED_VARIANT_RETENTION_CONTRACT=PASS')
          print('HANDOFF_CONFLICT_RETENTION_HOLD_RECONCILE_CONTRACT=PASS')
          print('PRIVACY_PROJECTION_CONTRACT=PASS')
          print('SOURCE_IDENTITY_GUARD_CONTRACT=PASS')
          PY

      - name: Derive authority-nonexpanding typed federation 44-of-44 operational view
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          audit_path = Path('protocol/JANUS_GENESIS_CONSTELLATION_ROLE_AUDIT-v1.0.json')
          manifest_path = Path('protocol/JANUS_GENESIS_ACTIVE_FACE_MANIFEST-v1.0.json')
          audit = json.loads(audit_path.read_text(encoding='utf-8'))
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          public = audit['public']
          private = audit['private']
          assert len(public) == 41 and len(private) == 3 and len(public) + len(private) == 44
          assert len({row['id'] for row in public + private}) == 44

          active_audit = [row for row in public if row['state'] == 'ACTIVE_TYPED_FACE']
          assert len(active_audit) == 2
          manifest_active = [face for face in manifest['faces'] if str(face['activation']).startswith('ACTIVE')]
          assert {face['id'] for face in manifest_active} == {row['id'] for row in active_audit}
          for face in manifest['faces']:
              assert face['can_mutate_source'] is False
              assert face['external_effect'] is False

          rows = []
          for row in public:
              reason = str(row.get('reason') or '').strip()
              assert reason, row['id']
              active = row['state'] == 'ACTIVE_TYPED_FACE'
              rows.append({
                  'id': row['id'],
                  'repository': row['repository'],
                  'visibility': 'PUBLIC',
                  'audit_state': row['state'],
                  'operational_state': 'ACTIVE_TYPED_FACE' if active else 'REFERENCE_ONLY_WITH_EXPLICIT_REASON',
                  'reason': reason,
                  'authority_promoted_by_finalizer': False,
              })
          for row in private:
              assert set(row) == {'id', 'state'}
              assert row['state'] == 'PRIVATE_OPAQUE_HOLD'
              rows.append({
                  'id': row['id'],
                  'visibility': 'PRIVATE_OPAQUE',
                  'audit_state': row['state'],
                  'operational_state': 'REFERENCE_ONLY_WITH_EXPLICIT_REASON',
                  'reason': 'PRIVATE_OPAQUE_HOLD: no public active admission is asserted; private role details remain intentionally undisclosed.',
                  'authority_promoted_by_finalizer': False,
              })

          active_count = sum(r['operational_state'] == 'ACTIVE_TYPED_FACE' for r in rows)
          reference_count = sum(r['operational_state'] == 'REFERENCE_ONLY_WITH_EXPLICIT_REASON' for r in rows)
          assert active_count == 2
          assert reference_count == 42
          assert active_count + reference_count == 44

          receipt = {
              'schema': 'janus.genesis.typed_federation_final_view.v1',
              'frozen_genesis_base': '227d42d6848790031916cac53d39961a19c35d08',
              'role_audit_pr': 137,
              'role_audit_head': '5627d31a992bcdc71dcc7351cba2c515dac89a2c',
              'source_inventory': '44=41_PUBLIC+3_PRIVATE_OPAQUE',
              'operational_counts': {
                  'ACTIVE_TYPED_FACE': active_count,
                  'REFERENCE_ONLY_WITH_EXPLICIT_REASON': reference_count,
                  'TOTAL': 44,
              },
              'rows': sorted(rows, key=lambda row: row['id']),
              'decision': {
                  'FEDERATION_FINAL_TYPED_44_OF_44': 'PASS',
                  'ALL_NON_ACTIVE_ROWS_FAIL_CLOSED_TO_REFERENCE_ONLY': True,
                  'CANDIDATE_IS_ACTIVE': False,
                  'HOLD_IS_ACTIVE': False,
                  'TOOL_IS_ACTIVE': False,
                  'PRIVATE_OPAQUE_IS_ACTIVE': False,
                  'REAL_OWNER_44_SOURCE_REPLAY_PROVEN_BY_THIS_VIEW': False,
                  'PRESERVATION_EMPIRICAL_REPLAY_PROVEN_BY_THIS_VIEW': False,
              },
              'safety': {
                  'SOURCE_WRITEBACK_DEFAULT': 'DENY',
                  'DESTRUCTIVE_ACTION': 'FORBIDDEN',
                  'AUTHORITY_DELTA': 0,
                  'MASS_EFFECT_BUDGET_DELTA': 0,
              },
          }
          payload = json.dumps(receipt, sort_keys=True, separators=(',', ':'), ensure_ascii=False, allow_nan=False)
          out = Path('artifacts/JANUS-TYPED-FEDERATION-FINAL-VIEW.json')
          out.write_text(payload + '\n', encoding='utf-8')
          digest = hashlib.sha256(payload.encode('utf-8')).hexdigest()
          Path('artifacts/JANUS-TYPED-FEDERATION-FINAL-VIEW.sha256').write_text(digest + '\n', encoding='ascii')
          print('FEDERATION_FINAL_TYPED_44_OF_44=PASS')
          print('FEDERATION_ACTIVE_TYPED_FACE_COUNT=2')
          print('FEDERATION_REFERENCE_ONLY_WITH_EXPLICIT_REASON_COUNT=42')
          print(f'FEDERATION_FINAL_VIEW_SHA256={digest}')
          PY

      - name: Emit scoped compatibility receipt and claim ceiling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          receipt = {
              'schema': 'janus.p0.public_preservation_federation_current_main_compatibility.v1',
              'frozen_genesis_base': '227d42d6848790031916cac53d39961a19c35d08',
              'current_swarm_main': 'b0bb07418cb1c0e1bc2da8ae443977825c0b19d1',
              'swarm_current_main_fencing_replay_pr': 9,
              'swarm_current_main_fencing_replay_head': '1d5a1c46ed5e6f99c4bb4cc745bf3c741809c120',
              'producer_lock_sha256': '3a1c2763ebe7d614a539b464eb3f75d0d74d362e0f061f8e732fc3554bc3c1d4',
              'producer_heads_verified_live_from_pr_refs': True,
              'public_preservation_primitives_current_main_compatibility': 'PASS',
              'lineage_failed_variant_retention_contract': 'PASS',
              'handoff_conflict_retention_hold_reconcile_contract': 'PASS',
              'privacy_projection_contract': 'PASS',
              'source_identity_guard_contract': 'PASS',
              'federation_final_typed_44_of_44': 'PASS',
              'real_owner_44_source_replay': 'NOT_PROVEN',
              'preservation_empirical_owner_bundle': 'NOT_PROVEN',
              'live_nas_hr1_hr10': 'NOT_PROVEN',
              'full_issue_162_acceptance': False,
              'safety': {
                  'CI_EPHEMERAL_OVERLAY_ONLY': True,
                  'SOURCE_WRITEBACK_DEFAULT': 'DENY',
                  'REMOTE_SOURCE_WRITEBACK': False,
                  'HISTORY_REWRITE': False,
                  'DESTRUCTIVE_ACTION': 'FORBIDDEN',
                  'AUTHORITY_DELTA': 0,
                  'MASS_EFFECT_BUDGET_DELTA': 0,
              },
          }
          payload = json.dumps(receipt, sort_keys=True, separators=(',', ':'), ensure_ascii=False, allow_nan=False)
          out = Path('artifacts/JANUS-PUBLIC-PRESERVATION-FEDERATION-CURRENT-MAIN-COMPATIBILITY.json')
          out.write_text(payload + '\n', encoding='utf-8')
          digest = hashlib.sha256(payload.encode('utf-8')).hexdigest()
          Path('artifacts/JANUS-PUBLIC-PRESERVATION-FEDERATION-CURRENT-MAIN-COMPATIBILITY.sha256').write_text(digest + '\n', encoding='ascii')
          print(f'PUBLIC_PRESERVATION_FEDERATION_COMPATIBILITY_SHA256={digest}')
          print('REAL_OWNER_44_SOURCE_REPLAY=NOT_PROVEN')
          print('PRESERVATION_EMPIRICAL_OWNER_BUNDLE=NOT_PROVEN')
          print('LIVE_NAS_HR1_HR10=NOT_PROVEN')
          print('FULL_ISSUE_162_ACCEPTANCE=FALSE')
          print('SOURCE_WRITEBACK_DEFAULT=DENY')
          print('DESTRUCTIVE_ACTION=FORBIDDEN')
          print('AUTHORITY_DELTA=0')
          PY

      - name: Upload privacy-safe scoped receipts
        uses: actions/upload-artifact@v4
        with:
          name: janus-p0-preservation-federation-current-main-v1
          path: artifacts/
          if-no-files-found: error
