name: ESSENCE v5.5 Genesis first-look functional transfer witness

on:
  pull_request:
    paths:
      - 'tools/essence_v55_functional_witness.py'
      - 'tests/test_essence_v55_functional_witness.py'
      - 'research/essence/v55_functional/FROZEN_CASES.json'
      - '.github/workflows/essence-v55-functional-witness.yml'
  push:
    branches: [main]
    paths:
      - 'tools/essence_v55_functional_witness.py'
      - 'tests/test_essence_v55_functional_witness.py'
      - 'research/essence/v55_functional/FROZEN_CASES.json'
      - '.github/workflows/essence-v55-functional-witness.yml'
  schedule:
    - cron: '9,39 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: essence-v55-genesis-functional-single-writer
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: '4'
  HF_HUB_DISABLE_TELEMETRY: '1'
  HF_HUB_DOWNLOAD_TIMEOUT: '120'
  TOKENIZERS_PARALLELISM: 'false'

jobs:
  frozen-functional-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Check immutable functional benchmark, model lineage and fail-closed receipts
        run: |
          python -m py_compile tools/essence_v55_functional_witness.py tests/test_essence_v55_functional_witness.py
          python -m unittest -v tests.test_essence_v55_functional_witness

  inspect-accepted-model-and-frozen-suite:
    needs: frozen-functional-contract
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ESSENCE_EVOLUTION_PAUSED != 'true' && vars.ESSENCE_V55_RECEIVER_PAUSED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.inspect.outputs.ready }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          path: code
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: essence-voice-state
          path: receiver
          persist-credentials: false
          sparse-checkout: |
            research/essence/v55_functional/receipts
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Inspect source-pinned accepted model; never execute donor repository code
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --filter=blob:none --sparse --branch essence-peer-shadow-state https://github.com/Hawkar-usls/Janus-Demiurge.git producer
          git -C producer sparse-checkout set --no-cone research/essence/peer_v55_state/ledger.json models/v54gen0003 models/v55gen0004 models/v55gen0005 models/v55gen0006 models/v55gen0007 models/v55gen0008 models/v55gen0009
      - name: Plan one G3 vs accepted descendant first-look
        id: inspect
        run: |
          python code/tools/essence_v55_functional_witness.py plan \
            --producer producer --genesis code --receiver receiver \
            --out runtime/essence/v55_functional/plan.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open("runtime/essence/v55_functional/plan.json"))
          print("ready="+str(p["action"]=="PAIR_G3_AGAINST_ACCEPTED_DESCENDANT").lower())
          PY
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          p=json.load(open("runtime/essence/v55_functional/plan.json"))
          print("### ESSENCE v5.5 Genesis functional witness")
          print("Decision:",p["action"])
          print("Candidate generation:",p.get("candidate_generation","none"))
          print("Functional tests are frozen in Genesis; no model gets training on them.")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: essence-v55-genesis-functional-plan-${{ github.run_id }}
          path: runtime/essence/v55_functional/plan.json
          retention-days: 30
          if-no-files-found: error

  perform-real-qwen-functional-transfer:
    needs: inspect-accepted-model-and-frozen-suite
    if: needs.inspect-accepted-model-and-frozen-suite.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          path: code
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: essence-v55-genesis-functional-plan-${{ github.run_id }}
          path: runtime/essence/v55_functional
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Checkout exact immutable producer Git SHA used by plan
        shell: bash
        run: |
          set -euo pipefail
          W55_SHA="$(python - <<'PY'
          import json,re
          p=json.load(open("runtime/essence/v55_functional/plan.json"))
          sha=p["producer_commit"]
          if not re.fullmatch("[a-f0-9]{40}",sha):
              raise SystemExit("WF55_INVALID_PRODUCER_REF")
          print(sha)
          PY
          )"
          test -n "$W55_SHA"
          git clone --quiet --depth 1 --filter=blob:none --sparse --branch essence-peer-shadow-state https://github.com/Hawkar-usls/Janus-Demiurge.git producer
          git -C producer fetch --quiet --depth 1 origin "$W55_SHA"
          git -C producer checkout --quiet --detach "$W55_SHA"
          git -C producer sparse-checkout set --no-cone research/essence/peer_v55_state/ledger.json models/v54gen0003 models/v55gen0004 models/v55gen0005 models/v55gen0006 models/v55gen0007 models/v55gen0008 models/v55gen0009
          test "$(git -C producer rev-parse HEAD)" = "$W55_SHA"
      - name: Install pinned CPU-only Qwen adapter dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-cache-dir transformers==4.48.3 peft==0.13.2 safetensors==0.5.3
      - name: Genuine paired G3-vs-descendant inference on 16 frozen non-JSON tasks
        run: |
          python code/tools/essence_v55_functional_witness.py infer \
            --producer producer --genesis code \
            --plan runtime/essence/v55_functional/plan.json \
            --out runtime/essence/v55_functional/receipt.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open("runtime/essence/v55_functional/receipt.json"))
          print("### ESSENCE functional first-look result")
          print("Generation:",d["accepted_generation"])
          print("Qwen CPU inference:",d["real_cpu_qwen_inference"])
          print("Frozen algorithmic tasks:",d["task_count"])
          print("G3 exact:",d["g3_exact"])
          print("Accepted descendant exact:",d["candidate_exact"])
          print("Newly correct:",d["newly_correct"])
          print("Previously correct lost:",d["previously_correct_lost"])
          print("Verdict:",d["status"])
          print("This does NOT change admitted neural weights or imply external replication.")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: essence-v55-genesis-functional-receipt-${{ github.run_id }}
          path: runtime/essence/v55_functional/receipt.json
          retention-days: 90
          if-no-files-found: error

  archive-frozen-transfer-receipt:
    needs: [inspect-accepted-model-and-frozen-suite,perform-real-qwen-functional-transfer]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          path: code
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: essence-voice-state
          path: receiver
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: essence-v55-genesis-functional-plan-${{ github.run_id }}
          path: runtime/essence/v55_functional
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: essence-v55-genesis-functional-receipt-${{ github.run_id }}
          path: runtime/essence/v55_functional
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Verify frozen plan and exact paired result before own-branch append-only receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import sys
          sys.path.insert(0,str(Path("code").resolve()))
          from tools import essence_v55_functional_witness as m
          p=m.check(m.read("runtime/essence/v55_functional/plan.json"))
          r=m.check(m.read("runtime/essence/v55_functional/receipt.json"))
          m.require(isinstance(p.get("receipt_file"),str) and
                    re.fullmatch(r"research/essence/v55_functional/receipts/[a-f0-9]{24}\.json",p["receipt_file"]) is not None and
                    p["receipt_file"]==m.RECEIPTS+"/"+p["ledger_sha256"][:24]+".json",
                    "WF55_RECEIPT_PATH_NOT_PINNED")
          m.require(p["schema"]==m.PLAN and
               r.get("schema")==m.SCHEMA and
               r.get("producer_commit")==p.get("producer_commit") and
               r.get("ledger_sha256")==p.get("ledger_sha256") and
               r.get("accepted_adapter_sha256")==p.get("candidate_adapter_sha256") and
               r.get("accepted_generation")==p.get("candidate_generation") and
               r.get("frozen_test_git_blob_sha1")==m.SUITE_BLOB and
               r.get("real_cpu_qwen_inference") is True and
               r.get("model_text_executed_as_code") is False and
               r.get("production_promotion") is False and
               r.get("sentinel_dispatch") is False and
               r.get("task_count")==16 and
               r.get("g3_exact") + r.get("newly_correct") -
               r.get("previously_correct_lost") == r.get("candidate_exact") and
               r.get("status")==(
                   "PASS_PROSPECTIVE_INTERNAL_FUNCTIONAL_TRANSFER" if
                   r.get("newly_correct",0)>=1 and r.get("previously_correct_lost")==0
                   and r.get("candidate_exact",0)>r.get("g3_exact",0) else
                   "HOLD_FUNCTIONAL_TRANSFER_NOT_PROVEN"),
               "WF55_FORGED_OR_INCONSISTENT_EXAM")
          m.write(Path("receiver")/p["receipt_file"],r)
          PY
          cd receiver
          git config user.name 'ESSENCE Genesis functional witness[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f research/essence/v55_functional/receipts
          git diff --cached --check
          git diff --cached --name-only > /tmp/v55-functional-staged.txt
          python - <<'PY'
          import re
          from pathlib import Path
          paths=Path("/tmp/v55-functional-staged.txt").read_text().splitlines()
          allowed=re.compile(r"^research/essence/v55_functional/receipts/[a-f0-9]{24}\.json$")
          if not paths or any(not allowed.fullmatch(p) for p in paths):
              raise SystemExit("WF55_UNAUTHORIZED_RECEIPT_WRITE")
          PY
          git commit -m 'Genesis: first-look functional Qwen G3 vs accepted ESSENCE v5.5 descendant'
          git pull --rebase origin essence-voice-state
          git push origin HEAD:refs/heads/essence-voice-state
          echo 'GENESIS_V55_FIRST_LOOK_FUNCTIONAL_RECEIPT_PERSISTED=true' >> "$GITHUB_STEP_SUMMARY"
