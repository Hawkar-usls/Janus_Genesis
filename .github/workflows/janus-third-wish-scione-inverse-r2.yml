name: JANUS Third Wish SciOne R2 inverse-hypothesis paired resident study

on:
  pull_request:
    branches:
      - research/third-wish-scione-model-r1
    paths:
      - "tools/genesis_scione_caption_provenance_r2.py"
      - "tools/genesis_third_wish_scione_inverse_r2.py"
      - "tests/test_genesis_third_wish_scione_inverse_r2.py"
      - "protocol/JANUS_GENESIS_THIRD_WISH_SCIONE_INVERSE_R2-v1.0.json"
      - "docs/GENESIS_THIRD_WISH_SCIONE_INVERSE_R2_2026_10_19.md"
      - ".github/workflows/janus-third-wish-scione-inverse-r2.yml"

permissions:
  contents: read

concurrency:
  group: janus-scione-inverse-r2-${{ github.ref }}
  cancel-in-progress: false

env:
  OLLAMA_INSTALL_URL: https://github.com/ollama/ollama/releases/download/v0.30.8/ollama-linux-amd64.tar.zst
  OLLAMA_INSTALL_SHA256: ffe2b2c2f2f5f5b30c081ec353c2e0bb2d9ead516064a8e22663b24b8fd8dca0
  RESIDENT_MODEL: qwen2.5:0.5b-instruct-q4_K_M
  RESIDENT_MODEL_DIGEST_PREFIX: a8b0c5157701

jobs:
  frozen-inverse-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate frozen fixture, captions provenance parser and inherited R1 contracts
        run: |
          python -m json.tool protocol/JANUS_GENESIS_THIRD_WISH_SCIONE_INVERSE_R2-v1.0.json >/dev/null
          python -m py_compile tools/genesis_scione_caption_provenance_r2.py tools/genesis_third_wish_scione_inverse_r2.py
          python -m unittest -v \
            tests.test_genesis_third_wish_scione_inverse_r2 \
            tests.test_genesis_third_wish_scione_model_r1 \
            tests.test_genesis_third_wish_sci_one_risk_replay
      - name: Validate isolated CI scope and no archive of copyrighted captions
        run: |
          python - <<'PY'
          from pathlib import Path
          yml = Path('.github/workflows/janus-third-wish-scione-inverse-r2.yml').read_text()
          assert 'contents: read' in yml
          assert 'persist-credentials: false' in yml
          assert ('${' + '{ secrets.') not in yml
          assert ('workflow_' + 'dispatch:') not in yml
          assert ('sche' + 'dule:') not in yml
          assert not any('captions_full' in p.name or 'subtitle_full' in p.name
                         for p in Path('protocol').glob('*'))
          print('R2_READ_ONLY_PREDECLARED_NO_RAW_CAPTION_ARCHIVE=PASS')
          PY

  paired-real-model:
    needs: frozen-inverse-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Genesis runtime requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Install pinned Ollama 0.30.8
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 "${OLLAMA_INSTALL_URL}" \
            -o "${RUNNER_TEMP}/ollama-linux-amd64.tar.zst"
          echo "${OLLAMA_INSTALL_SHA256}  ${RUNNER_TEMP}/ollama-linux-amd64.tar.zst" | sha256sum -c -
          sudo tar --zstd -xf "${RUNNER_TEMP}/ollama-linux-amd64.tar.zst" -C /usr
          ollama --version | tee "${RUNNER_TEMP}/ollama-r2-version.txt"
          grep -q '0.30.8' "${RUNNER_TEMP}/ollama-r2-version.txt"
      - name: Start pinned loopback model
        shell: bash
        run: |
          set -euo pipefail
          export OLLAMA_HOST=127.0.0.1:11434
          export OLLAMA_NUM_PARALLEL=1
          export OLLAMA_MAX_LOADED_MODELS=1
          ollama serve > "${RUNNER_TEMP}/ollama-r2.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/version >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/version
          ollama pull "${RESIDENT_MODEL}"
          ollama list | tee "${RUNNER_TEMP}/ollama-r2-model-list.txt"
          grep -q "${RESIDENT_MODEL_DIGEST_PREFIX}" "${RUNNER_TEMP}/ollama-r2-model-list.txt"
      - name: Execute 7 paired reverse hypotheses in 28 supervised model cycles
        shell: bash
        run: |
          set -euo pipefail
          python tools/genesis_third_wish_scione_inverse_r2.py \
            --model "${RESIDENT_MODEL}" \
            --endpoint http://127.0.0.1:11434 \
            --output "${RUNNER_TEMP}/scione-inverse-r2-witness.json"
      - name: Validate complete outcome without overclaiming autonomy
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          w = json.loads((Path(os.environ['RUNNER_TEMP']) / 'scione-inverse-r2-witness.json').read_text())
          assert w['status'] == 'COMPLETE_EXPLORATORY_OBSERVATIONS'
          assert w['model_cycles_settled'] == 28
          assert len(w['arms']) == 14 and len(w['paired_comparisons']) == 7
          assert all(arm['result'] == 'COMPLETE_TWO_PHASES' for arm in w['arms'])
          assert all(arm['letter_removed_before_second_cycle'] for arm in w['arms'])
          assert w['raw_model_text_recorded'] is False
          assert w['external_effect_authority_granted'] is False
          assert w['reverse_advantage_claimed'] is False
          assert w['independent_os_network_isolation_attested'] is False
          print('R2_28_REAL_CYCLES_AND_PAIRED_SENTINEL_RECEIPTS=OBSERVED')
          print('R2_CREATIVE_SEMANTICS_AND_INDEPENDENT_ISOLATION=NOT_ESTABLISHED')
          PY
      - name: Retain sanitized receipts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janus-scione-inverse-r2-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/scione-inverse-r2-witness.json
            ${{ runner.temp }}/ollama-r2-version.txt
            ${{ runner.temp }}/ollama-r2-model-list.txt
          retention-days: 30
