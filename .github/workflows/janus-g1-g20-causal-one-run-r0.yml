name: JANUS Genesis G1-G20 Single Causal Cohort R0

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/janus_nexus_g1_g20_causal_join_v1.py'
      - 'tests/test_janus_nexus_g1_g20_causal_join_v1.py'
      - '.github/workflows/janus-g1-g20-causal-one-run-r0.yml'
      - '.github/workflows/janus-g20-phase2-frozen-reusable-v1.yml'
      - '.github/workflows/janus-g20-ttl-frozen-reusable-v1.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/janus-g1-g20-causal-one-run-r0.yml'
  workflow_dispatch:

# No cron. One shared GitHub Actions run_id for Phase2 and TTL.
# Isolated lab branch only; no production source writeback.
permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Reject cross-run receipt replay, history drift and fake ACKs
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/janus_nexus_g1_g20_causal_join_v1.py
          python -m unittest discover -s tests -p 'test_janus_nexus_g1_g20_causal_join_v1.py' -v
          python tools/audit_armor_effect_drift_v18_7_50.py > "$RUNNER_TEMP/armor50.json"
          python tools/audit_armor_effect_drift_v18_7_51.py > "$RUNNER_TEMP/armor51.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          for n in (50,51):
              r=json.loads((Path(os.environ['RUNNER_TEMP'])/f'armor{n}.json').read_text())
              assert r['unclassified_surface_count']==0
              assert r['classification_is_security_certification'] is False
          PY
          echo 'JANUS_G1_G20_CAUSAL_CONTRACT_OFFLINE=PASS'

  phase2:
    needs: offline-contract
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'Hawkar-usls/Janus_Genesis'
    permissions: {contents: write}
    uses: ./.github/workflows/janus-g20-phase2-frozen-reusable-v1.yml
    secrets:
      JANUS_NEXUS_PRIVATE_READ_TOKEN: ${{ secrets.JANUS_NEXUS_PRIVATE_READ_TOKEN }}

  ttl:
    needs: phase2
    if: needs.phase2.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'Hawkar-usls/Janus_Genesis'
    permissions: {contents: write}
    uses: ./.github/workflows/janus-g20-ttl-frozen-reusable-v1.yml
    with:
      expected_predecessor_sha: ${{ needs.phase2.outputs.b_head }}

  external-dispatch:
    needs: [phase2,ttl]
    if: needs.ttl.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'Hawkar-usls/Janus_Genesis'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions: {contents: read}
    outputs:
      dispatch_state: ${{ steps.send.outputs.dispatch_state }}
    steps:
      - name: Authenticated cross-repository workflow dispatch or explicit HOLD
        id: send
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.JANUS_NEXUS_DEMIURGE_DISPATCH_TOKEN }}
          B_HEAD: ${{ needs.phase2.outputs.b_head }}
        run: |
          set -euo pipefail
          [[ "$B_HEAD" =~ ^[0-9a-f]{40}$ ]]
          if [ -z "$GH_TOKEN" ]; then
            echo 'dispatch_state=HOLD_MISSING_SCOPED_CROSS_REPO_TOKEN' >> "$GITHUB_OUTPUT"
            echo 'JANUS_EXTERNAL_DISPATCH=HOLD_MISSING_SCOPED_CROSS_REPO_TOKEN'
            exit 0
          fi
          if ! gh api -X POST \
              repos/Hawkar-usls/Janus-Demiurge/actions/workflows/janus-nexus-external-dynamic-ack-v1.yml/dispatches \
              -f ref=main \
              -f "inputs[source_run]=$GITHUB_RUN_ID" \
              -f "inputs[attempt]=$GITHUB_RUN_ATTEMPT" \
              -f "inputs[source_sha]=$GITHUB_SHA" \
              -f "inputs[b_head]=$B_HEAD" >/dev/null; then
            echo 'dispatch_state=HOLD_CROSS_REPO_DISPATCH_REJECTED' >> "$GITHUB_OUTPUT"
            echo 'JANUS_EXTERNAL_DISPATCH=HOLD_CROSS_REPO_DISPATCH_REJECTED'
            exit 0
          fi
          echo 'dispatch_state=DISPATCHED_TO_REAL_DEMIURGE' >> "$GITHUB_OUTPUT"
          echo 'JANUS_EXTERNAL_DISPATCH=DISPATCHED_TO_REAL_DEMIURGE'

  external-origin-check:
    needs: [phase2,ttl,external-dispatch]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'Hawkar-usls/Janus_Genesis'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions: {contents: read}
    outputs:
      external_status: ${{ steps.prove.outputs.external_status }}
    steps:
      - uses: actions/checkout@v4
        if: needs.external-dispatch.outputs.dispatch_state == 'DISPATCHED_TO_REAL_DEMIURGE'
        with: {ref: "${{ needs.phase2.outputs.b_head }}", path: _state, persist-credentials: false}
      - name: Poll only separate Demiurge Git branch for this root-run ACK
        id: prove
        shell: bash
        env:
          DISPATCH_STATE: ${{ needs.external-dispatch.outputs.dispatch_state }}
          B_HEAD: ${{ needs.phase2.outputs.b_head }}
          TTL_HEAD: ${{ needs.ttl.outputs.takeover_head }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP"
          if [ "$DISPATCH_STATE" != DISPATCHED_TO_REAL_DEMIURGE ]; then
            echo 'external_status=HOLD_NO_VERIFIED_EXTERNAL_DISPATCH' >> "$GITHUB_OUTPUT"
            echo 'JANUS_EXTERNAL_CAUSAL_ACK=HOLD_NO_VERIFIED_EXTERNAL_DISPATCH'
            exit 0
          fi
          [[ "$B_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TTL_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C _state rev-parse HEAD)" = "$B_HEAD"
          git clone --quiet --depth=1 --single-branch \
            --branch janus/nexus-external-organ-ack-state \
            https://github.com/Hawkar-usls/Janus-Demiurge.git "$RUNNER_TEMP/organ-ack-repo"
          found=''
          for n in $(seq 1 75); do
            git -C "$RUNNER_TEMP/organ-ack-repo" pull --ff-only --quiet || true
            shopt -s nullglob
            candidates=( "$RUNNER_TEMP/organ-ack-repo/data/nexus_external_acks/receipts/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-dynamic-external-"*.json )
            shopt -u nullglob
            if [ "${#candidates[@]}" -gt 1 ]; then
              echo 'JANUS_EXTERNAL_CAUSAL_ACK=HOLD_MULTIPLE_AMBIGUOUS_ACKS'
              echo 'external_status=HOLD_MULTIPLE_AMBIGUOUS_ACKS' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "${#candidates[@]}" -eq 1 ]; then
              found="${candidates[0]}"
              break
            fi
            sleep 10
          done
          if [ -z "$found" ]; then
            echo 'external_status=HOLD_ACK_NOT_RECEIVED_IN_BOUNDED_POLL' >> "$GITHUB_OUTPUT"
            echo 'JANUS_EXTERNAL_CAUSAL_ACK=HOLD_ACK_NOT_RECEIVED_IN_BOUNDED_POLL'
            exit 0
          fi
          cp -- "$found" "$RUNNER_TEMP/external-ack.json"
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          base=Path("_state/data/nexus_integrated_native_lab/runs")/(os.environ["GITHUB_RUN_ID"]+"-"+os.environ["GITHUB_RUN_ATTEMPT"])
          chk=json.loads((base/"checkpoint.json").read_text())
          variants=json.loads((base/"variants.json").read_text())
          b=json.loads((base/"worker-b.json").read_text())
          row=json.loads((Path(os.environ["RUNNER_TEMP"])/"external-ack.json").read_text())
          chosen=[r for r in variants["candidates"] if r["variant_id"]==variants["selected_variant_id"]]
          assert len(chosen)==1
          require = lambda v: (_ for _ in ()).throw(ValueError("ACK_LINEAGE_MISMATCH")) if not v else None
          require(row["schema"]=="janus.nexus.dynamic_external_organ_ack.v1")
          require(row["status"]=="PASS_REAL_EXTERNAL_DEMIURGE_NATIVE_CONSUMPTION_SCOPED")
          require(row["sender_source_run_id"]==os.environ["GITHUB_RUN_ID"])
          require(row["sender_source_attempt"]==int(os.environ["GITHUB_RUN_ATTEMPT"]))
          require(row["sender_code_sha"]==os.environ["GITHUB_SHA"]==chk["code_sha"])
          require(row["sender_b_git_head"]==os.environ["B_HEAD"])
          require(row["selected_proposal_sha256"]==chosen[0]["proposal"]["proposal_sha256"])
          require(row["sender_completion_id"]==b["completion_id"])
          require(row["receiver_repository"]=="Hawkar-usls/Janus-Demiurge")
          require(row["external_organ_is_separate_git_repository_and_runner"] is True)
          require(row["real_external_organ_readonly_consumption_proven"] is True)
          require(row["source_writeback"] is False and row["authority_delta"]==0)
          require(row["full_issue_162_acceptance"] is False)
          receiver=str(row["external_receiver_run_id"])
          require(re.fullmatch("[1-9][0-9]{3,23}",receiver) is not None)
          (Path(os.environ["RUNNER_TEMP"])/"receiver-run-id").write_text(receiver)
          PY
          receiver_run="$(cat "$RUNNER_TEMP/receiver-run-id")"
          passed=0
          for n in $(seq 1 14); do
            if curl -fsSL -H 'Accept: application/vnd.github+json' \
                "https://api.github.com/repos/Hawkar-usls/Janus-Demiurge/actions/runs/$receiver_run" \
                > "$RUNNER_TEMP/external-run.json" && \
               curl -fsSL -H 'Accept: application/vnd.github+json' \
                "https://api.github.com/repos/Hawkar-usls/Janus-Demiurge/actions/runs/$receiver_run/jobs?per_page=50" \
                > "$RUNNER_TEMP/external-jobs.json"; then
              if python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])
          ack=json.loads((p/'external-ack.json').read_text())
          run=json.loads((p/'external-run.json').read_text())
          jobs=json.loads((p/'external-jobs.json').read_text())['jobs']
          assert run.get('status')=='completed' and run.get('conclusion')=='success'
          assert run.get('event')=='workflow_dispatch'
          assert run.get('head_sha')==ack['external_receiver_source_sha']
          assert run.get('name')=='JANUS Nexus Dynamic External Organ ACK v1'
          statuses={j['name']:j['conclusion'] for j in jobs}
          assert statuses.get('consume')=='success'
          assert statuses.get('independent-verdict')=='success'
          PY
              then
                passed=1
                break
              fi
            fi
            sleep 8
          done
          if [ "$passed" != 1 ]; then
            echo 'external_status=HOLD_EXTERNAL_RUN_NOT_INDEPENDENTLY_COMPLETED' >> "$GITHUB_OUTPUT"
            echo 'JANUS_EXTERNAL_CAUSAL_ACK=HOLD_EXTERNAL_RUN_NOT_INDEPENDENTLY_COMPLETED'
            exit 0
          fi
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])
          ack=json.loads((p/"external-ack.json").read_text())
          run=json.loads((p/"external-run.json").read_text())
          out={"schema":"janus.nexus.external_git_origin_check.v1",
               "status":"PASS_CROSS_REPO_GIT_ACK_AND_WORKFLOW_VERIFIED_SCOPED",
               "sender_run_id":os.environ["GITHUB_RUN_ID"],
               "sender_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),
               "sender_code_sha":os.environ["GITHUB_SHA"],
               "sender_b_git_head":os.environ["B_HEAD"],
               "receiver_run_id":run["id"],
               "receiver_source_sha":run["head_sha"],
               "receiver_workflow_url":run["html_url"],
               "same_root_run_and_proposal_checked":True,
               "independent_receiver_job_success":True,
               "production_integration_ack":False,
               "full_issue_162_acceptance":False,
               "source_writeback":False,"authority_delta":0}
          (p/"external-origin-verdict.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          PY
          echo 'external_status=PASS_CROSS_REPO_GIT_ACK_AND_WORKFLOW_VERIFIED_SCOPED' >> "$GITHUB_OUTPUT"
          echo 'JANUS_EXTERNAL_CAUSAL_ACK=PASS_CROSS_REPO_GIT_ACK_AND_WORKFLOW_VERIFIED_SCOPED'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: janus-g20-external-origin-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/external-ack.json
            ${{ runner.temp }}/external-origin-verdict.json
          if-no-files-found: warn
          retention-days: 30

  independent-causal-join:
    needs: [offline-contract,phase2,ttl,external-origin-check]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'Hawkar-usls/Janus_Genesis'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}", path: _code, persist-credentials: false}
      - uses: actions/checkout@v4
        if: needs.ttl.result == 'success'
        with:
          ref: "${{ needs.ttl.outputs.takeover_head }}"
          path: _state
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: needs.phase2.result == 'success'
        with:
          name: nexus-phase2-independent-verdict-${{ github.run_id }}
          path: ${{ runner.temp }}/phase2
      - uses: actions/download-artifact@v4
        if: needs.ttl.result == 'success'
        with:
          name: nexus-lease-verdict-${{ github.run_id }}
          path: ${{ runner.temp }}/ttl
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Demand one SOURCE SHA, one run ID, one phase2-B-to-seed Git parent
        shell: bash
        env:
          OFFLINE: ${{ needs.offline-contract.result }}
          PHASE2: ${{ needs.phase2.result }}
          TTL: ${{ needs.ttl.result }}
          EXTERNAL_ORIGIN: ${{ needs.external-origin-check.outputs.external_status }}
          B_HEAD: ${{ needs.phase2.outputs.b_head }}
          TAKE_HEAD: ${{ needs.ttl.outputs.takeover_head }}
        run: |
          set -euo pipefail
          for value in "$OFFLINE" "$PHASE2" "$TTL"; do
            test "$value" = success
          done
          [[ "$B_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TAKE_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$B_HEAD" != "$TAKE_HEAD"
          test "$(git -C _state rev-parse HEAD)" = "$TAKE_HEAD"
          test "$(git -C _state ls-remote origin refs/heads/janus/nexus-closed-loop-lab-state | cut -f1)" = "$TAKE_HEAD"
          seed="$(python -c 'import json,os;from pathlib import Path;r=json.loads((Path(os.environ["RUNNER_TEMP"])/"ttl/lease-verdict.json").read_text());print(r["seed_git_sha"])')"
          [[ "$seed" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C _state rev-list --parents -n 1 "$seed" | awk '{print $2}')" = "$B_HEAD"
          git -C _state merge-base --is-ancestor "$B_HEAD" "$seed"
          git -C _state merge-base --is-ancestor "$seed" "$TAKE_HEAD"
          (
            cd _code
            python tools/janus_nexus_g1_g20_causal_join_v1.py \
              --root "$GITHUB_WORKSPACE/_state" \
              --run-id "$GITHUB_RUN_ID" \
              --attempt "$GITHUB_RUN_ATTEMPT" \
              --source-sha "$GITHUB_SHA" \
              --phase2 "$RUNNER_TEMP/phase2/phase2-verdict.json" \
              --ttl "$RUNNER_TEMP/ttl/lease-verdict.json" \
              --phase2-b-head "$B_HEAD" \
              --ttl-takeover-head "$TAKE_HEAD" \
              --ttl-seed-parent "$B_HEAD" \
              --out "$RUNNER_TEMP/g1-g20-causal-join.json"
          )
          python - <<'PY'
          import os,json
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'g1-g20-causal-join.json').read_text())
          assert r['status']=='PASS_SAME_RUN_PHASE2_TO_TTL_GIT_JOIN_WITH_HARD_HOLDS'
          assert r['same_run_phase2_to_ttl_git_parent_verified'] is True
          assert r['phase2_two_clean_real44_verified'] is True
          assert r['lease_expiry_stale_owner_git_fence_verified'] is True
          assert r['external_organ_same_cohort_ack'] is False
          assert r['neural_patch_same_cohort_holdout'] is False
          assert r['full_issue_162_acceptance'] is False
          assert r['g1_to_g20_full_acceptance'] is False
          assert len(r['g1_g20_scoped_observations'])==20
          assert len(r['hard_holds'])>=4
          assert r['scientific_authority_delta']==0
          PY
          echo "JANUS_G1_G20_CAUSAL_EXTERNAL_ORIGIN=$EXTERNAL_ORIGIN"
          echo 'JANUS_G1_G20_SAME_RUN_PHASE2_TTL=PASS_SCOPED'
          echo 'JANUS_G1_G20_FULL_ACCEPTANCE=HOLD'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: janus-g1-g20-single-cohort-R0-${{ github.run_id }}
          path: ${{ runner.temp }}/g1-g20-causal-join.json
          if-no-files-found: warn
          retention-days: 30
