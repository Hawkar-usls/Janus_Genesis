name: JANUS Corpus Callosum (bicameral offline gate)

on:
  pull_request:
    paths:
      - 'tools/janus_corpus_callosum.py'
      - 'tools/janus_corpus_callosum_v2.py'
      - 'tools/golem_bicameral_r3_eval.py'
      - 'tools/golem_bicameral_r4_native_probe.py'
      - 'tools/golem_r4b_native_diagnostics.py'
      - 'tools/golem_r4c_provider_preflight.py'
      - 'tools/janus_corpus_v2_publisher.py'
      - 'tools/janus_corpus_home_handoff.py'
      - 'tools/janus_corpus_git_publisher.py'
      - 'tests/test_janus_corpus_callosum.py'
      - 'tests/test_janus_corpus_callosum_v2.py'
      - 'tests/test_golem_bicameral_r3_eval.py'
      - 'tests/test_golem_bicameral_r4_native_probe.py'
      - 'tests/test_golem_r4b_native_diagnostics.py'
      - 'tests/test_golem_r4c_provider_preflight.py'
      - 'tests/test_janus_corpus_home_handoff.py'
      - 'tests/test_janus_corpus_git_publisher.py'
      - 'tests/test_janus_corpus_real_native_cpu.py'
      - '.github/workflows/janus-corpus-callosum-v1.yml'
      - 'docs/JANUS_CORPUS_CALLOSUM_V1.md'
      - 'docs/JANUS_CORPUS_CALLOSUM_V2.md'
      - 'docs/JANUS_GOLEM_BICAMERAL_R3.md'
      - 'docs/JANUS_GOLEM_BICAMERAL_R4.md'
      - 'docs/JANUS_GOLEM_R4B_R4C.md'
      - 'benchmarks/golem_r4b_public_diagnostics.json'
      - 'benchmarks/golem_r4b_public_diagnostics_key.json'
      - 'benchmarks/golem_r4_native_cpu_pilot.json'
      - 'benchmarks/golem_r4_native_cpu_pilot_key.json'
      - 'benchmarks/golem_bicameral_r3_calibration.json'
      - 'benchmarks/golem_bicameral_r3_calibration_key.json'
  workflow_dispatch:

permissions:
  contents: read

# Respect Genesis HOME writer serialization even during read-only experiments.
concurrency:
  group: janus-habitat-cloud-home-state
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run bicameral and free-gateway fake-inference tests (NO NETWORK)
        run: |
          python -m unittest -v \
            tests.test_janus_corpus_callosum \
            tests.test_janus_corpus_callosum_v2 \
            tests.test_golem_bicameral_r3_eval \
            tests.test_golem_bicameral_r4_native_probe \
            tests.test_golem_r4b_native_diagnostics \
            tests.test_golem_r4c_provider_preflight \
            tests.test_janus_corpus_home_handoff \
            tests.test_janus_corpus_git_publisher \
            tests.test_golem_free_federation \
            tests.test_genesis_beetle_model_consumption


  r3-calibration-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen R3 tasks, public answers and no-provider status
        run: |
          python tools/golem_bicameral_r3_eval.py \
            --pack benchmarks/golem_bicameral_r3_calibration.json \
            --key benchmarks/golem_bicameral_r3_calibration_key.json
          python -m unittest -v tests.test_golem_bicameral_r3_eval

  r4c-no-network-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify free-provider contract without exposing or using secrets
        run: |
          python tools/golem_r4c_provider_preflight.py
          python -m unittest -v tests.test_golem_r4c_provider_preflight

  pinned-native-e2e:
    # Actual CPU execution of an immutable Demiurge revision. The external
    # provider is always mocked and Git publishing stays on a local bare remote.
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      JANUS_NATIVE_DEMIURGE_CHECKOUT: ${{ github.workspace }}/_native_demiurge
      JANUS_REQUIRE_REAL_NATIVE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout Genesis test contract without write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout reviewed immutable Demiurge CPU kernel
        uses: actions/checkout@v4
        with:
          repository: Hawkar-usls/Janus-Demiurge
          ref: 8873e5121a67daac5c8afb8ff297d6565dc87c32
          path: _native_demiurge
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only PyTorch (no GPU, no external model inference)
        run: |
          python -m pip install --disable-pip-version-check \
            'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Run actual native CPU and injected external/rollback gauntlet
        run: |
          python -m unittest -v tests.test_janus_corpus_real_native_cpu
      - name: Measure PUBLIC short native-only R4A pilot with real pinned weights
        run: |
          python tools/golem_bicameral_r4_native_probe.py \
            --pack benchmarks/golem_r4_native_cpu_pilot.json \
            --key benchmarks/golem_r4_native_cpu_pilot_key.json \
            --native-repo "$JANUS_NATIVE_DEMIURGE_CHECKOUT" \
            --native-head 8873e5121a67daac5c8afb8ff297d6565dc87c32 \
            --execute --out "$RUNNER_TEMP/golem-r4-native-baseline.json"
      - name: R4B diagnose real pinned native output by task family (no external API)
        run: |
          python tools/golem_r4b_native_diagnostics.py \
            --pack benchmarks/golem_r4b_public_diagnostics.json \
            --key benchmarks/golem_r4b_public_diagnostics_key.json \
            --native-repo "$JANUS_NATIVE_DEMIURGE_CHECKOUT" \
            --execute --out "$RUNNER_TEMP/golem-r4b-public-diagnostics.json"
      - name: Attach separate R4B raw excerpts for audit
        if: \${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: golem-r4b-public-native-diagnostics
          path: \${{ runner.temp }}/golem-r4b-public-diagnostics.json
          if-no-files-found: warn
          retention-days: 14
      - name: Attach native-only pilot evidence, even on incomplete run
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: golem-r4-native-public-pilot
          path: ${{ runner.temp }}/golem-r4-native-baseline.json
          if-no-files-found: warn
          retention-days: 14

  inspect-home:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted bridge code
        uses: actions/checkout@v4
        with:
          ref: main
          path: _code
          persist-credentials: false
      - name: Checkout existing read-only Genesis HOME
        uses: actions/checkout@v4
        with:
          ref: janus/habitat-cloud-state
          path: _state
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate staged context without running either hemisphere
        run: |
          python _code/tools/janus_corpus_callosum.py \
            --home-root _state/state/habitat_cloud_home
      - name: Capture immutable HOME core and inspect publication (NO PUSH)
        shell: bash
        run: |
          set -euo pipefail
          python _code/tools/janus_corpus_home_handoff.py \
            --home-root _state/state/habitat_cloud_home \
            --capture-baseline "$RUNNER_TEMP/janus-corpus-before.json"
          python _code/tools/janus_corpus_git_publisher.py \
            --checkout _state \
            --baseline "$RUNNER_TEMP/janus-corpus-before.json"

# Deliberately no live or paid-capable job. Real native inference requires a
# separately approved fixed Demiurge checkout and a provisioned PyTorch CPU.
# External model credentials are not exposed to this workflow. The offline Git
# bare-remote gauntlet proves the publisher's non-force crash semantics before
# any later reviewed live workflow can invoke its explicit --publish gate.
