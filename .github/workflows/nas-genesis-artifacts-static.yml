name: JANUS NAS Legacy Genesis Static Artifact Validation

on:
  pull_request:
    paths:
      - 'archaeology/nas_genesis_20261031/**'
      - 'tests/test_nas_genesis_legacy_artifacts.py'
      - '.github/workflows/nas-genesis-artifacts-static.yml'
  push:
    branches: [main]
    paths:
      - 'archaeology/nas_genesis_20261031/**'
      - 'tests/test_nas_genesis_legacy_artifacts.py'
      - '.github/workflows/nas-genesis-artifacts-static.yml'
permissions:
  contents: read
jobs:
  historical-artifact-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate early Genesis JSON archives without running legacy code
        run: python -m unittest discover -s tests -p test_nas_genesis_legacy_artifacts.py -v
