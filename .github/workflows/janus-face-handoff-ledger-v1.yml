name: JANUS Face Handoff Ledger v1

on:
  pull_request:
    paths:
      - 'tools/janus_face_handoff_ledger.py'
      - 'tools/janus_project_face_handoff.py'
      - 'tests/test_janus_face_handoff_ledger_v1.py'
      - 'protocol/JANUS_FACE_HANDOFF_LEDGER-v1.0.json'
      - 'protocol/JANUS_PROJECT_MULTI_FACE_COORDINATION-v1.0.json'
      - '.github/workflows/janus-face-handoff-ledger-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff-ledger-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile ledger and existing validator
        run: |
          python -m py_compile \
            tools/janus_face_handoff_ledger.py \
            tools/janus_project_face_handoff.py \
            tests/test_janus_face_handoff_ledger_v1.py

      - name: Validate contracts
        run: |
          python -m json.tool protocol/JANUS_FACE_HANDOFF_LEDGER-v1.0.json >/dev/null
          python -m json.tool protocol/JANUS_PROJECT_MULTI_FACE_COORDINATION-v1.0.json >/dev/null

      - name: Run ledger adversarial tests
        run: python -m unittest -v tests.test_janus_face_handoff_ledger_v1

      - name: Assert ledger adds no network or subprocess import
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('tools/janus_face_handoff_ledger.py')
          tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          forbidden = {'socket', 'subprocess', 'urllib', 'http', 'requests'}
          found = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  found.extend(
                      alias.name for alias in node.names
                      if alias.name.split('.')[0] in forbidden
                  )
              elif isinstance(node, ast.ImportFrom):
                  root = (node.module or '').split('.')[0]
                  if root in forbidden:
                      found.append(node.module or root)
          assert not found, f'direct effect-capable imports found: {found}'
          print('FACE_HANDOFF_LEDGER_DIRECT_NETWORK_OR_SUBPROCESS_IMPORTS=NONE')
          PY

      - name: Emit authority-neutral gate receipt
        run: |
          echo 'FACE_HANDOFF_LEDGER_V1=TESTED_LOCAL_PRIMITIVE'
          echo 'COMMAND_EXECUTION=FALSE'
          echo 'SOURCE_WRITEBACK=FALSE'
          echo 'PERMISSION_GRANTED=FALSE'
          echo 'TRUTH_AUTHORITY_GRANTED=FALSE'
          echo 'EFFECT_AUTHORITY_GRANTED=FALSE'
          echo 'AUTHORITY_DELTA=0'
          echo 'MASS_EFFECT_BUDGET_DELTA=0'
