name: JANUS Third Wish SciOne R4 repeated divergent memory-fork research

on:
  pull_request:
    branches:
      - research/third-wish-scione-causal-memory-r3
    paths:
      - "protocol/JANUS_GENESIS_THIRD_WISH_SCIONE_DIVERGENT_R4-v1.0.json"
      - "tools/genesis_third_wish_scione_divergent_r4.py"
      - "tests/test_genesis_third_wish_scione_divergent_r4.py"
      - "tools/genesis_third_wish_scione_blind_review_lock_r4.py"
      - "tests/test_genesis_third_wish_scione_blind_review_lock_r4.py"
      - "docs/GENESIS_THIRD_WISH_SCIONE_DIVERGENT_R4_2026_10_19.md"
      - "docs/GENESIS_THIRD_WISH_SCIONE_R3_BLIND_REVIEW_FOR_R4_2026_10_19.md"
      - ".github/workflows/janus-third-wish-scione-divergent-r4.yml"

permissions:
  contents: read

concurrency:
  group: janus-scione-divergent-r4-${{ github.ref }}
  cancel-in-progress: false

env:
  OLLAMA_INSTALL_URL: https://github.com/ollama/ollama/releases/download/v0.30.8/ollama-linux-amd64.tar.zst
  OLLAMA_INSTALL_SHA256: ffe2b2c2f2f5f5b30c081ec353c2e0bb2d9ead516064a8e22663b24b8fd8dca0
  RESIDENT_MODEL: qwen2.5:0.5b-instruct-q4_K_M
  RESIDENT_MODEL_DIGEST_PREFIX: a8b0c5157701

jobs:
  frozen-replication-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate R4 protocol and inherited R3 contracts
        run: |
          python -m json.tool protocol/JANUS_GENESIS_THIRD_WISH_SCIONE_DIVERGENT_R4-v1.0.json >/dev/null
          python -m py_compile tools/genesis_third_wish_scione_divergent_r4.py
          python -m unittest -v \
            tests.test_genesis_third_wish_scione_divergent_r4 \
            tests.test_genesis_third_wish_scione_blind_review_lock_r4 \
            tests.test_genesis_third_wish_scione_causal_r3 \
            tests.test_genesis_third_wish_scione_inverse_r2 \
            tests.test_genesis_third_wish_scione_model_r1
      - name: Validate independent review is explicitly pending and credentials omitted
        run: |
          python - <<'PY'
          from pathlib import Path
          content = Path('.github/workflows/janus-third-wish-scione-divergent-r4.yml').read_text()
          doc = Path('docs/GENESIS_THIRD_WISH_SCIONE_R3_BLIND_REVIEW_FOR_R4_2026_10_19.md').read_text()
          assert 'contents: read' in content
          assert 'persist-credentials: false' in content
          assert ('${' + '{ secrets.') not in content
          assert ('workflow_' + 'dispatch:') not in content
          assert ('sche' + 'dule:') not in content
          assert 'independent human scorer not appointed' in doc
          assert 'Do not retrieve' in doc
          print('R4_READ_ONLY_WITH_PROCEDURAL_BLIND_REVIEW_GATE=PASS')
          PY

  repeated-real-resident-trials:
    needs: frozen-replication-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing Genesis runtime requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Install pinned Ollama 0.30.8
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 "${OLLAMA_INSTALL_URL}" -o "${RUNNER_TEMP}/ollama-linux-amd64.tar.zst"
          echo "${OLLAMA_INSTALL_SHA256}  ${RUNNER_TEMP}/ollama-linux-amd64.tar.zst" | sha256sum -c -
          sudo tar --zstd -xf "${RUNNER_TEMP}/ollama-linux-amd64.tar.zst" -C /usr
          ollama --version | tee "${RUNNER_TEMP}/ollama-r4-version.txt"
          grep -q '0.30.8' "${RUNNER_TEMP}/ollama-r4-version.txt"
      - name: Start loopback Ollama and verify exact model digest
        shell: bash
        run: |
          set -euo pipefail
          export OLLAMA_HOST=127.0.0.1:11434
          export OLLAMA_NUM_PARALLEL=1
          export OLLAMA_MAX_LOADED_MODELS=1
          ollama serve > "${RUNNER_TEMP}/ollama-r4.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/version >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/version
          ollama pull "${RESIDENT_MODEL}"
          ollama list | tee "${RUNNER_TEMP}/ollama-r4-model-list.txt"
          grep -q "${RESIDENT_MODEL_DIGEST_PREFIX}" "${RUNNER_TEMP}/ollama-r4-model-list.txt"
      - name: Run 48 supervised local MODEL.CALLs in 16 repeated matching trials
        shell: bash
        run: |
          set -euo pipefail
          python tools/genesis_third_wish_scione_divergent_r4.py \
            --model "${RESIDENT_MODEL}" --endpoint http://127.0.0.1:11434 \
            --output "${RUNNER_TEMP}/scione-divergent-r4-witness.json" \
            --blind-output "${RUNNER_TEMP}/scione-divergent-r4-blind-packet.json" \
            --mapping-output "${RUNNER_TEMP}/scione-divergent-r4-private-mapping.json"
      - name: Validate 48 bounded completions, with no semantic advantage claim
        if: success()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          w = json.loads((root / 'scione-divergent-r4-witness.json').read_text())
          blind = json.loads((root / 'scione-divergent-r4-blind-packet.json').read_text())
          assert w['status'] == 'COMPLETE_EXPLORATORY_OBSERVATIONS'
          assert w['settled_model_calls'] == w['expected_real_model_calls'] == 48
          assert w['trial_count'] == 16 and len(w['rows']) == 16
          assert all(len(r['forks']) == 2 for r in w['rows'])
          assert all(f['result'] == 'COMPLETE_BRANCH' for r in w['rows'] for f in r['forks'].values())
          assert all(f['identical_journal_and_resident_at_fork'] for r in w['rows'] for f in r['forks'].values())
          assert w['world_effect_authority_granted'] is False
          assert w['external_effects_executed'] is False
          assert w['independent_human_blind_scores_completed'] is False
          assert w['semantic_novelty_advantage_proven'] is False
          assert blind['ratings_collected'] is False
          assert all('branch' not in item and 'frame' not in item for item in blind['items'])
          print('R4_48_BOUNDED_MODEL_CALLS=OBSERVED')
          print('R4_HUMAN_SEMANTIC_REVIEW=OPEN')
          PY
      - name: Save hashed model witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janus-scione-divergent-r4-witness-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/scione-divergent-r4-witness.json
            ${{ runner.temp }}/ollama-r4-version.txt
            ${{ runner.temp }}/ollama-r4-model-list.txt
          retention-days: 30
      - name: Save redacted randomized blind-review packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janus-scione-divergent-r4-blind-packet-${{ github.run_id }}
          path: ${{ runner.temp }}/scione-divergent-r4-blind-packet.json
          retention-days: 30
      - name: Save separate mapping without automated unblinding
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janus-scione-divergent-r4-private-mapping-${{ github.run_id }}
          path: ${{ runner.temp }}/scione-divergent-r4-private-mapping.json
          retention-days: 30
