name: JANUS Third Wish SciOne R3 blinded exploratory memory forks

on:
  pull_request:
    branches:
      - research/third-wish-scione-inverse-autonomy-r2
    paths:
      - "tools/genesis_third_wish_scione_causal_r3.py"
      - "tests/test_genesis_third_wish_scione_causal_r3.py"
      - "protocol/JANUS_GENESIS_THIRD_WISH_SCIONE_CAUSAL_MEMORY_R3-v1.0.json"
      - "docs/GENESIS_THIRD_WISH_SCIONE_CAUSAL_R3_2026_10_19.md"
      - ".github/workflows/janus-third-wish-scione-causal-r3.yml"

permissions:
  contents: read

concurrency:
  group: janus-scione-causal-r3-${{ github.ref }}
  cancel-in-progress: false

env:
  OLLAMA_INSTALL_URL: https://github.com/ollama/ollama/releases/download/v0.30.8/ollama-linux-amd64.tar.zst
  OLLAMA_INSTALL_SHA256: ffe2b2c2f2f5f5b30c081ec353c2e0bb2d9ead516064a8e22663b24b8fd8dca0
  RESIDENT_MODEL: qwen2.5:0.5b-instruct-q4_K_M
  RESIDENT_MODEL_DIGEST_PREFIX: a8b0c5157701

jobs:
  frozen-causal-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate pinned protocol and inherited R1/R2 contracts
        run: |
          python -m json.tool protocol/JANUS_GENESIS_THIRD_WISH_SCIONE_CAUSAL_MEMORY_R3-v1.0.json >/dev/null
          python -m py_compile tools/genesis_third_wish_scione_causal_r3.py
          python -m unittest -v tests.test_genesis_third_wish_scione_causal_r3 tests.test_genesis_third_wish_scione_inverse_r2 tests.test_genesis_third_wish_scione_model_r1
      - name: Enforce read-only, no credential runner scope
        run: |
          python - <<'PY'
          from pathlib import Path
          content = Path('.github/workflows/janus-third-wish-scione-causal-r3.yml').read_text()
          assert 'contents: read' in content
          assert 'persist-credentials: false' in content
          assert ('${' + '{ secrets.') not in content
          assert ('workflow_' + 'dispatch:') not in content
          assert ('sche' + 'dule:') not in content
          print('R3_STATIC_READ_ONLY_SCOPE=PASS')
          PY

  real-memory-forks:
    needs: frozen-causal-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Genesis runtime requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Install pinned Ollama 0.30.8
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 "${OLLAMA_INSTALL_URL}" -o "${RUNNER_TEMP}/ollama-linux-amd64.tar.zst"
          echo "${OLLAMA_INSTALL_SHA256}  ${RUNNER_TEMP}/ollama-linux-amd64.tar.zst" | sha256sum -c -
          sudo tar --zstd -xf "${RUNNER_TEMP}/ollama-linux-amd64.tar.zst" -C /usr
          ollama --version | tee "${RUNNER_TEMP}/ollama-r3-version.txt"
          grep -q '0.30.8' "${RUNNER_TEMP}/ollama-r3-version.txt"
      - name: Start pinned loopback model
        shell: bash
        run: |
          set -euo pipefail
          export OLLAMA_HOST=127.0.0.1:11434
          export OLLAMA_NUM_PARALLEL=1
          export OLLAMA_MAX_LOADED_MODELS=1
          ollama serve > "${RUNNER_TEMP}/ollama-r3.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/version >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/version
          ollama pull "${RESIDENT_MODEL}"
          ollama list | tee "${RUNNER_TEMP}/ollama-r3-model-list.txt"
          grep -q "${RESIDENT_MODEL_DIGEST_PREFIX}" "${RUNNER_TEMP}/ollama-r3-model-list.txt"
      - name: Execute 18 bounded model calls in identical-state memory forks
        shell: bash
        run: |
          set -euo pipefail
          python tools/genesis_third_wish_scione_causal_r3.py \
            --model "${RESIDENT_MODEL}" --endpoint http://127.0.0.1:11434 \
            --output "${RUNNER_TEMP}/scione-causal-r3-witness.json" \
            --blind-output "${RUNNER_TEMP}/scione-causal-r3-blind-packet.json" \
            --mapping-output "${RUNNER_TEMP}/scione-causal-r3-private-arm-mapping.json"
      - name: Check bounded observations, not a creativity claim
        if: success()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          tmp = Path(os.environ['RUNNER_TEMP'])
          w = json.loads((tmp / 'scione-causal-r3-witness.json').read_text())
          blind = json.loads((tmp / 'scione-causal-r3-blind-packet.json').read_text())
          assert w['status'] == 'COMPLETE_EXPLORATORY_OBSERVATIONS'
          assert w['settled_model_calls'] == w['expected_model_calls'] == 18
          assert len(w['cases']) == 6
          assert all(len(c['forks']) == 2 for c in w['cases'])
          assert all(f['result'] == 'COMPLETE_BRANCH' for c in w['cases'] for f in c['forks'].values())
          assert w['external_effect_authority_granted'] is False
          assert w['production_habitat_mutated'] is False
          assert w['independent_blind_human_review_completed'] is False
          assert w['semantic_advantage_proven'] is False
          assert blind['ratings_collected'] is False
          assert all('branch' not in i and 'frame' not in i for i in blind['items'])
          print('R3_18_BOUNDED_CALLS_AND_MEMORY_FORKS=OBSERVED')
          print('R3_CAUSAL_AND_SEMANTIC_CLAIMS=EXPLORATORY_ONLY')
          PY
      - name: Upload bounded witness, independent from review text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janus-scione-causal-r3-witness-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/scione-causal-r3-witness.json
            ${{ runner.temp }}/ollama-r3-version.txt
            ${{ runner.temp }}/ollama-r3-model-list.txt
          retention-days: 30
      - name: Upload redacted, pseudonymous semantic review packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janus-scione-causal-r3-blind-packet-${{ github.run_id }}
          path: ${{ runner.temp }}/scione-causal-r3-blind-packet.json
          retention-days: 30
      - name: Upload separate mapping for later human unblinding
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: janus-scione-causal-r3-private-mapping-${{ github.run_id }}
          path: ${{ runner.temp }}/scione-causal-r3-private-arm-mapping.json
          retention-days: 30
